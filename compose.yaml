# Local stack: Atlas Local (mongod + mongot with Automated Embedding) + the app.
#   docker compose up -d --build
#   docker compose run --rm app python -m scripts.seed
#   docker compose run --rm app python -m scripts.indexes
services:
  mongo:
    # :preview bundles the Community mongot build, needed for autoEmbed indexes.
    # Pinned by digest for reproducibility; bump deliberately.
    image: mongodb/mongodb-atlas-local:preview@sha256:ff75fd47e918952cc91094e888e8aeb7529aeb70f987b075aeef3944c9bd8014
    hostname: mongo
    environment:
      # Embeds documents and query text. Atlas-issued keys use the default endpoint;
      # keys created directly at voyageai.com need https://api.voyageai.com/v1/embeddings.
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:?set VOYAGE_API_KEY in .env}
      VOYAGE_EMBEDDING_PROVIDER_ENDPOINT: ${VOYAGE_EMBEDDING_PROVIDER_ENDPOINT:-https://ai.mongodb.com/v1/embeddings}
    # Loopback only: Atlas Local runs without auth, so don't expose it to the LAN.
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    # Health check is built into the image.

  app:
    build:
      context: .
      dockerfile: Dockerfile.vercel
    # Rebuild on every `up`, so the container never runs stale code. Layer caching
    # keeps unchanged builds fast.
    pull_policy: build
    env_file: .env
    environment:
      PORT: "8000"
      MONGODB_URI: mongodb://mongo:27017/?directConnection=true
      # funds_morningstar (real; see README) or funds (synthetic).
      FUNDS_COLLECTION: ${FUNDS_COLLECTION:-funds_morningstar}
    ports:
      - "127.0.0.1:8000:8000"
    # /health pings Mongo (503 when unreachable). The slim image has no curl.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
  mongo-config:
